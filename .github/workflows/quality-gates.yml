# The quality gates from CLAUDE.md, run by a machine instead of by hand.
#
# This one carries a database, so it differs from both sibling workflows in
# exactly two places: the MariaDB service, and `composer test-db` before the
# test run. Two tests need a visible reference to exist; without that step
# they skip rather than fail, which reads as green on a machine that never
# had the data.
#
# The rollout is the second job below. It waits for the gates, runs only on a
# push to `main`, and reaches the Uberspace with a key that is restricted
# there to exactly one command.
name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    name: Lint, test and build
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: db
          MARIADB_USER: db
          MARIADB_PASSWORD: db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # The test environment appends `_test` to the database name, so this
      # points at `db` and Doctrine creates `db_test` next to it.
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/db?serverVersion=10.11.0-mariadb&charset=utf8mb4"

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # The version the Uberspace serves. `composer.json` allows anything
          # from 8.4 up, but testing against a version that never ships means a
          # gate can stay green while the release stumbles.
          php-version: '8.5'
          extensions: ctype, iconv, imagick, pdo_mysql
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # A lock file that no longer matches composer.json installs versions
      # nobody chose. It went unnoticed in the sibling project once already.
      - name: Validate the composer files
        run: composer validate --no-check-all --no-check-publish

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress

      - name: Install Node dependencies
        run: npm ci

      - name: Lint Twig
        run: php bin/console lint:twig templates

      - name: Lint YAML
        run: php bin/console lint:yaml config

      - name: Lint the service container
        run: php bin/console lint:container

      # Piped through xargs on purpose: with `-exec` the step reports the exit
      # status of `find`, which GNU find leaves at zero even when the linter
      # failed. xargs passes the failure through.
      - name: Lint PHP
        run: find src tests -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Build the test database
        run: composer test-db

      - name: Test
        run: php bin/phpunit

      - name: Build the stylesheet
        run: npm run build

      # `output.css` is committed and linked statically, so a template that
      # introduces a utility class without a rebuild ships a stylesheet that
      # silently lacks it. If the build changes the file, the commit is
      # incomplete.
      - name: Check the committed stylesheet is current
        run: git diff --exit-code --stat public/css/output.css

  # Rolling out is a second job, so it can only start once the gates are
  # green. The key it uses is restricted on the server to exactly one
  # command — `cd ~/html/krausgedruckt && bin/deploy` — so a leaked secret
  # buys a redeploy of what is already on `main`, and nothing else.
  #
  # This is the one project of the three whose deployment touches a database.
  # What makes it safe to run unattended sits in `bin/deploy`, not here: a
  # pending migration is dumped before it runs, so the step a code rollback
  # cannot undo has a way back.
  deploy:
    name: Roll out
    needs: gates
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Load the deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Run bin/deploy on the server
        run: >-
          ssh -T -o StrictHostKeyChecking=accept-new
          ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
