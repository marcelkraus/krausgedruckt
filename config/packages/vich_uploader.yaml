vich_uploader:
    db_driver: orm
    mappings:
        reference_images_landscape:
            uri_prefix: /images/references/landscape
            upload_destination: '%kernel.project_dir%/public/images/references/landscape'
            namer: App\Service\ReferenceImageNamer
        reference_images_portrait:
            uri_prefix: /images/references/portrait
            upload_destination: '%kernel.project_dir%/public/images/references/portrait'
            namer: App\Service\ReferenceImageNamer
