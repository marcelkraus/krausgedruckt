framework:
    rate_limiter:
        contact_form:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'

        # The backend answers with HTTP Basic, and Symfony's `login_throttling`
        # does not reach it: that mechanism only covers authenticators it
        # considers interactive, which Basic is not. Without this, the admin
        # path accepted passwords in a loop at whatever rate the network
        # allowed. `AdminLoginThrottleListener` spends it.
        admin_login:
            policy: 'sliding_window'
            limit: 5
            interval: '15 minutes'

# The limiter state outlives a single test run, so the production limit of 5
# per hour makes the contact-form tests fail once the suite has run a few
# times within the hour. Raise it out of the way; the throttling behavior
# itself is configuration, not something these tests assert.
when@test:
    framework:
        rate_limiter:
            contact_form:
                limit: 1000
