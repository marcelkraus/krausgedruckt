framework:
    rate_limiter:
        contact_form:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'
        model_image:
            policy: 'sliding_window'
            limit: 60
            interval: '1 hour'
        model_lookup:
            policy: 'sliding_window'
            limit: 30
            interval: '1 hour'
        # Two mails per inquiry, one to an address the sender picks: an open relay otherwise.
        print_order:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'

# The limiter state outlives a test run, so the test limit is raised out of the way.
when@test:
    framework:
        rate_limiter:
            contact_form:
                limit: 1000
            model_image:
                limit: 1000
            model_lookup:
                limit: 1000
            print_order:
                limit: 1000
