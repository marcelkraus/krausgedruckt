twig:
    default_path: '%kernel.project_dir%/templates'
    # The shop and the Instagram account are linked from several templates;
    # as a global the address sits in exactly one place in the project.
    globals:
        etsy_url: '%app.etsy_url%'
        instagram_url: '%app.instagram_url%'

twig_extra:
    markdown:
        enabled: true
    commonmark:
        renderer:
            # A single newline has to survive as a visible line break, because
            # the descriptions are written in a plain textarea.
            soft_break: "<br />\n"

when@test:
    twig:
        strict_variables: true
