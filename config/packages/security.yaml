security:
    password_hashers:
        Symfony\Component\Security\Core\User\InMemoryUser: 'auto'
    providers:
        # Name and hash both come from the environment. A memory provider
        # would put the user name into this file as a YAML key, where
        # `%env()%` is not resolved.
        admin_user:
            id: App\Security\EnvironmentUserProvider
    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        admin:
            pattern: ^/admin
            lazy: true
            provider: admin_user
            http_basic:
                realm: 'krausgedruckt:admin'
            logout:
                path: admin_logout
                target: app_homepage
        main:
            lazy: true
    access_control:
        - { path: ^/admin, roles: ROLE_ADMIN }

when@test:
    security:
        password_hashers:
            # The in-memory user is bound to `auto` above, and that binding is
            # more specific than the interface below it – without naming the
            # class here too, the backend test pays for a cost-13 hash on
            # every attempt it makes.
            Symfony\Component\Security\Core\User\InMemoryUser:
                algorithm: auto
                cost: 4
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
