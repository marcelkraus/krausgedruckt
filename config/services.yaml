# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Outbound targets. Each of them appears in more than one place – the
    # footer, a page, a redirect route – and a changed address must not have
    # to be hunted through the templates. Values that differ per machine
    # belong in .env instead; these do not.
    app.contact_email_address: 'mail@krausgedruckt.de'
    # Only the imprint and the privacy policy show an address, and they show
    # this one: whatever is harvested from a legal page arrives on its own
    # tag and can be filtered without touching the mailbox.
    app.legal_email_address: 'mail+legal@krausgedruckt.de'
    app.app_store_url_mobile: 'https://apps.apple.com/de/app/3d-druck-kostenrechner/id6502561182'
    app.etsy_url: 'https://www.etsy.com/shop/krausgedrucktDE'
    app.google_review_url: 'https://g.page/r/CW-IKJ1ZcOv8EBM/review'
    app.instagram_url: 'https://www.instagram.com/krausgedruckt'
    app.whats_app_url: 'https://wa.me/message/TKVKBR7RPHA7B1'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

