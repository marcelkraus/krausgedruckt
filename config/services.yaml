# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.app_store_url_mobile: 'https://apps.apple.com/de/app/3d-druck-kostenrechner/id6502561182'
    app.contact_email_address: 'mail@krausgedruckt.de'
    app.etsy_url: 'https://www.etsy.com/shop/krausgedrucktDE'
    app.google_review_url: 'https://g.page/r/CW-IKJ1ZcOv8EBM/review'
    app.instagram_url: 'https://www.instagram.com/krausgedruckt'
    # Shown on the legal pages only, so what is harvested there arrives on its own tag.
    app.legal_email_address: 'mail+legal@krausgedruckt.de'
    app.phone_number: '+49 151 47828523'
    app.whats_app_url: 'https://wa.me/message/TKVKBR7RPHA7B1'

    app.minimum_order_value: 20

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Service\HostResolver: '@App\Service\DnsHostResolver'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

when@test:
    services:
        # A test that forgets to set up an answer fails instead of reaching a platform.
        App\Service\PlatformFetcher:
            arguments:
                $httpClient: '@app.refusing_http_client'

        app.refusing_http_client:
            class: Symfony\Component\HttpClient\MockHttpClient
            arguments: [[]]
